<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            min-height: 100vh;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
        }
        @media (min-width: 640px) {
            .wheel-container {
                width: 340px;
                height: 340px;
            }
        }
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid #facc15;
            z-index: 50;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen selection:bg-amber-500 selection:text-black">

    <header class="w-full py-6 px-4 md:px-8 border-b border-white/10 backdrop-blur-md bg-slate-950/40 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-500 bg-clip-text text-transparent">
                    Glücksrad
                </h1>
                <p class="text-xs text-slate-400">Individuelles Glücksrad mit Optionen & %-Modus</p>
            </div>
        </div>
    </header>

    <div id="winnerModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-amber-500/30 rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl shadow-amber-500/10 transform scale-95 transition-transform duration-300 text-center relative" id="winnerModalContent">
            <h3 class="text-xs font-semibold uppercase tracking-widest text-amber-400 mb-2 pt-2">Das Glücksrad hat entschieden</h3>
            <div id="winnerModalText" class="text-2xl md:text-3xl font-extrabold text-white my-3 break-words">1</div>
            <p class="text-xs text-slate-400 mb-6">Herzlichen Glückwunsch zum Ergebnis!</p>
            <button onclick="closeWinnerModal()" class="w-full py-3 px-6 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 font-bold text-sm tracking-wide shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
                Super, nochmal drehen!
            </button>
        </div>
    </div>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 md:py-12 flex flex-col items-center justify-center">

        <div id="wheelSection" class="w-full flex flex-col items-center">
            
            <!-- Modus Umschalter -->
            <div class="flex items-center space-x-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800 mb-6 shadow-lg">
                <button id="modeEqualBtn" onclick="switchMode('equal')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow-md">
                    ⚖️ Gleichmäßige Segmente
                </button>
                <button id="modePercentBtn" onclick="switchMode('percent')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white">
                    📊 Prozent-Modus (%)
                </button>
            </div>

            <!-- Wheel Message Box -->
            <div id="wheelMessageBox" class="mb-6 w-full max-w-md p-4 rounded-xl bg-slate-900/80 border border-slate-800 text-center font-medium text-sm transition-all duration-300 shadow-xl hidden">
                <span id="wheelMessageText"></span>
            </div>

            <!-- Wheel Canvas Container -->
            <div class="wheel-container my-2">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="340" height="340" class="w-full h-full drop-shadow-2xl rounded-full"></canvas>
            </div>

            <!-- Summen-Anzeige für Prozentmodus -->
            <div id="percentSumWarning" class="mt-3 text-xs font-semibold px-3 py-1 rounded-lg bg-red-950/80 border border-red-800 text-red-300 hidden">
                ⚠️ Summe der Prozente muss genau 100% ergeben (Aktuell: <span id="currentSumText">0</span>%)
            </div>

            <!-- Spin Trigger Button -->
            <div class="mt-5 mb-8 w-full max-w-xs">
                <button id="spinButton" onclick="spinWheel()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black text-lg tracking-wide shadow-lg shadow-amber-500/25 active:scale-95 transition-all flex items-center justify-center space-x-2">
                    <span>🎡</span>
                    <span>GLÜCKSRAD DREHEN</span>
                </button>
            </div>

            <!-- Configuration Form -->
            <div class="w-full max-w-xl bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 backdrop-blur-md shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                    <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-2">
                        <span>⚙️</span>
                        <span id="configTitle">Optionen & Möglichkeiten</span>
                    </h3>
                    <div class="flex items-center space-x-2 flex-wrap gap-2">
                        <button onclick="randomizeWheelOptions()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-slate-100 text-xs font-semibold rounded-lg transition shadow-md flex items-center space-x-1">
                            <span>🎲</span>
                            <span>Zahlen einfügen</span>
                        </button>
                        <div id="countInputWrapper" class="flex items-center space-x-1">
                            <label id="countLabel" class="text-xs text-slate-400">Anzahl (1–999):</label>
                            <input type="number" id="wheelCountInput" min="1" max="999" value="6" onchange="changeWheelCountByInput(this.value)" class="w-20 bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded px-2 py-1.5 focus:outline-none focus:border-amber-500 text-center font-bold">
                        </div>
                    </div>
                </div>

                <div id="wheelInputsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-72 overflow-y-auto pr-2">
                    <!-- Dynamically generated inputs -->
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full py-6 text-center text-xs text-slate-500 border-t border-white/5">
        <p>Glücksrad • Interaktives Entscheidungs-Tool</p>
    </footer>

    <script>
        let wheelMode = 'equal'; // 'equal' or 'percent'
        let wheelOptions = ["1", "2", "3", "4", "5", "6"];
        let wheelPercentages = [16, 17, 17, 17, 17, 16]; // used in percent mode
        let wheelColors = []; 
        let currentRotationAngle = 0; 
        let isSpinningWheel = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            if (type === 'win') {
                const now = audioCtx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + index * 0.08);
                    g.gain.setValueAtTime(0.2, now + index * 0.08);
                    g.gain.linearRampToValueAtTime(0.01, now + index * 0.08 + 0.25);
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.start(now + index * 0.08);
                    o.stop(now + index * 0.08 + 0.25);
                });
            } else if (type === 'tick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            }
        }

        function getRandomColor(index) {
            const hue = Math.floor(Math.random() * 360);
            const saturation = 75 + Math.floor(Math.random() * 20);
            const lightness = 45 + Math.floor(Math.random() * 15);
            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        function generateRandomColors() {
            wheelColors = [];
            for (let i = 0; i < wheelOptions.length; i++) {
                wheelColors.push(getRandomColor(i));
            }
        }

        function switchMode(mode) {
            if (isSpinningWheel) return;
            wheelMode = mode;

            const equalBtn = document.getElementById('modeEqualBtn');
            const percentBtn = document.getElementById('modePercentBtn');
            const countInput = document.getElementById('wheelCountInput');
            const countLabel = document.getElementById('countLabel');

            if (mode === 'equal') {
                equalBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-amber-500 text-slate-950 shadow-md";
                percentBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white";
                document.getElementById('percentSumWarning').classList.add('hidden');
                
                countInput.max = "999";
                countLabel.textContent = "Anzahl (1–999):";
            } else {
                percentBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-slate-100 shadow-md";
                equalBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white";

                countInput.max = "10";
                countLabel.textContent = "Anzahl (1–10):";
                if (wheelOptions.length > 10) {
                    wheelOptions = wheelOptions.slice(0, 10);
                }

                if (wheelPercentages.length !== wheelOptions.length) {
                    const equalVal = Math.floor(100 / wheelOptions.length);
                    wheelPercentages = wheelOptions.map(() => equalVal);
                    let sum = wheelPercentages.reduce((a, b) => a + b, 0);
                    if (wheelOptions.length > 0) {
                        wheelPercentages[wheelOptions.length - 1] += (100 - sum);
                    }
                }
                checkPercentSum();
            }
            initWheelInputs();
        }

        function checkPercentSum() {
            if (wheelMode !== 'percent') return true;
            let sum = wheelPercentages.reduce((a, b) => a + Number(b), 0);
            document.getElementById('currentSumText').textContent = sum;
            const warning = document.getElementById('percentSumWarning');
            if (sum !== 100) {
                warning.classList.remove('hidden');
                return false;
            } else {
                warning.classList.add('hidden');
                return true;
            }
        }

        function initWheelInputs() {
            const container = document.getElementById('wheelInputsContainer');
            container.innerHTML = '';
            document.getElementById('wheelCountInput').value = wheelOptions.length;

            if (wheelColors.length !== wheelOptions.length) {
                generateRandomColors();
            }

            wheelOptions.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center space-x-2";
                const color = wheelColors[index];

                let extraInputHtml = '';
                if (wheelMode === 'percent') {
                    const pct = wheelPercentages[index] !== undefined ? wheelPercentages[index] : 0;
                    extraInputHtml = `
                        <div class="flex items-center space-x-1 flex-shrink-0">
                            <input type="number" min="1" max="100" value="${pct}" oninput="updateWheelPercent(${index}, this.value)" class="w-14 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-amber-400 focus:outline-none focus:border-amber-500 text-center font-bold" placeholder="%">
                            <span class="text-xs text-slate-400">%</span>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <span id="badge-${index}" class="w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-slate-950 shadow-md" style="background-color: ${color}">${index + 1}</span>
                    <input type="text" value="${opt}" oninput="updateWheelOption(${index}, this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500" placeholder="Zahl ${index + 1}">
                    ${extraInputHtml}
                `;
                container.appendChild(div);
            });
            drawWheel(currentRotationAngle);
        }

        function changeWheelCountByInput(val) {
            if (isSpinningWheel) return;
            let count = parseInt(val);
            const maxVal = wheelMode === 'percent' ? 10 : 999;
            if (isNaN(count) || count < 1) count = 1;
            if (count > maxVal) count = maxVal;
            
            document.getElementById('wheelCountInput').value = count;

            while (wheelOptions.length < count) {
                wheelOptions.push(`${wheelOptions.length + 1}`);
            }
            while (wheelOptions.length > count) {
                wheelOptions.pop();
            }

            if (wheelMode === 'percent') {
                const equalVal = Math.floor(100 / count);
                wheelPercentages = wheelOptions.map(() => equalVal);
                if (count > 0) {
                    wheelPercentages[count - 1] += (100 - (equalVal * count));
                }
                checkPercentSum();
            }

            generateRandomColors();
            initWheelInputs();
        }

        function updateWheelOption(index, val) {
            wheelOptions[index] = val;
            drawWheel(currentRotationAngle);
        }

        function updateWheelPercent(index, val) {
            wheelPercentages[index] = parseFloat(val) || 0;
            checkPercentSum();
            drawWheel(currentRotationAngle);
        }

        function randomizeWheelOptions() {
            if (isSpinningWheel) return;
            
            let count = wheelOptions.length;
            if (wheelMode === 'percent' || count < 2 || count > (wheelMode === 'percent' ? 10 : 20)) {
                count = Math.floor(Math.random() * 5) + 4;
            }

            wheelOptions = [];
            for (let i = 0; i < count; i++) {
                wheelOptions.push(`${i + 1}`);
            }

            if (wheelMode === 'percent') {
                const equalVal = Math.floor(100 / count);
                wheelPercentages = wheelOptions.map(() => equalVal);
                wheelPercentages[count - 1] += (100 - (equalVal * count));
                checkPercentSum();
            }

            generateRandomColors();
            initWheelInputs();
        }

        function getSegmentAngles() {
            const numSegments = wheelOptions.length;
            let segments = [];
            let currentAngle = 0;

            for (let i = 0; i < numSegments; i++) {
                let arcSize;
                if (wheelMode === 'percent') {
                    const pct = wheelPercentages[i] !== undefined ? wheelPercentages[i] : (100 / numSegments);
                    arcSize = (pct / 100) * 2 * Math.PI;
                } else {
                    arcSize = (2 * Math.PI) / numSegments;
                }

                segments.push({
                    index: i,
                    start: currentAngle,
                    end: currentAngle + arcSize,
                    arc: arcSize
                });
                currentAngle += arcSize;
            }
            return segments;
        }

        function drawWheel(angle) {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const radius = canvas.width / 2;
            const segments = getSegmentAngles();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(radius, radius);
            ctx.rotate(angle);

            segments.forEach(seg => {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 4, seg.start, seg.end);
                ctx.closePath();

                ctx.fillStyle = wheelColors[seg.index] || getRandomColor(seg.index);
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#09090b';
                ctx.stroke();

                if (wheelOptions.length <= 40) {
                    ctx.save();
                    ctx.rotate(seg.start + seg.arc / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold " + (wheelOptions.length > 20 ? "9px" : "13px") + " Inter, sans-serif";
                    let labelText = wheelOptions[seg.index].substring(0, 10);
                    if (wheelMode === 'percent') {
                        labelText += ` (${wheelPercentages[seg.index]}%)`;
                    }
                    ctx.fillText(labelText, radius - 20, 5);
                    ctx.restore();
                }
            });

            ctx.restore();

            ctx.beginPath();
            ctx.arc(radius, radius, 22, 0, 2 * Math.PI);
            ctx.fillStyle = "#09090b";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#facc15";
            ctx.stroke();
        }

        function spinWheel() {
            if (isSpinningWheel) return;
            if (wheelMode === 'percent' && !checkPercentSum()) {
                return;
            }

            isSpinningWheel = true;

            const btn = document.getElementById('spinButton');
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            document.getElementById('wheelMessageBox').classList.add('hidden');

            const segments = getSegmentAngles();
            
            let winningIndex = 0;
            if (wheelMode === 'percent') {
                const randVal = Math.random() * 100;
                let acc = 0;
                for (let i = 0; i < wheelPercentages.length; i++) {
                    acc += Number(wheelPercentages[i]);
                    if (randVal <= acc) {
                        winningIndex = i;
                        break;
                    }
                }
            } else {
                winningIndex = Math.floor(Math.random() * wheelOptions.length);
            }

            const winningSeg = segments[winningIndex];
            const randomOffset = (Math.random() * 0.8 + 0.1) * winningSeg.arc;
            const segmentCenterAngle = winningSeg.start + randomOffset;
            const targetRotation = (3 * Math.PI / 2) - segmentCenterAngle;

            const extraRounds = (6 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
            const normalizedCurrent = currentRotationAngle % (2 * Math.PI);
            let targetNormalized = targetRotation % (2 * Math.PI);
            if (targetNormalized < 0) targetNormalized += 2 * Math.PI;

            let delta = targetNormalized - normalizedCurrent;
            if (delta <= 0) delta += 2 * Math.PI;

            const totalDelta = delta + extraRounds;
            const startAngle = currentRotationAngle;
            const duration = 4000;
            const startTime = performance.now();

            let lastTickSegment = -1;

            function animateWheel(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                currentRotationAngle = startAngle + (totalDelta * easeProgress);

                drawWheel(currentRotationAngle);

                const currentNormalized = (3 * Math.PI / 2 - currentRotationAngle) % (2 * Math.PI);
                const positiveNormalized = (currentNormalized + 2 * Math.PI) % (2 * Math.PI);
                
                let currentSegmentIdx = 0;
                for (let s of segments) {
                    if (positiveNormalized >= s.start && positiveNormalized < s.end) {
                        currentSegmentIdx = s.index;
                        break;
                    }
                }
                
                if (currentSegmentIdx !== lastTickSegment) {
                    playSound('tick');
                    lastTickSegment = currentSegmentIdx;
                }

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    isSpinningWheel = false;
                    btn.disabled = false;
                    btn.classList.remove('opacity-70', 'cursor-not-allowed');

                    const winner = wheelOptions[winningIndex];

                    showWinnerModal(winner);
                    playSound('win');
                    triggerConfetti();
                }
            }

            requestAnimationFrame(animateWheel);
        }

        function showWinnerModal(winner) {
            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('winnerModalContent');
            const modalText = document.getElementById('winnerModalText');
            
            modalText.textContent = `${winner}!`;
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('winnerModalContent');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
        }

        function triggerConfetti() {
            confetti({
                particleCount: 90,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#facc15', '#eab308', '#ca8a04', '#ffffff']
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initWheelInputs();
        });
    </script>
</body>
</html>
